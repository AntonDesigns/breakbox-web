# breakbox-web CI. The React launcher (frontend) of BreakBox.
# Max-Anton Horvat. Complex Software Systems (S6). sig 0x4D414836.
#
# For now this repo runs its own scan set. Once breakbox-security publishes the shared
# reusable scan workflow, these jobs become `uses: AntonDesigns/breakbox-security/.github/workflows/scan.yml@main`
# so every repo runs one owned-by-security scan set (that is the point of the split).

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: npm audit (known-vulnerable dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SonarCloud scan for the React/TypeScript launcher. A SEPARATE SonarCloud project from the .NET
  # repos. This gives the frontend the same maintainability / reliability / security-hotspot analysis
  # the backend gets, so every repo is scanned the same way.
  #
  # IMPORTANT: the launcher has no tests yet, so coverage is 0%. SonarCloud's default "Sonar way" gate
  # requires coverage on new code, which would be a permanent false red here. So on THIS project's gate
  # (SonarCloud > the project > Quality Gate) use a gate WITHOUT the coverage condition, or add vitest
  # tests later and report lcov. Until then this is a quality + security SCAN, not a coverage gate.
  #
  # Gated until configured, same as the other repos. To turn it on, in repo Settings:
  #   Variables: SONAR_ENABLED=true, SONAR_ORG=<sonarcloud org key>, SONAR_PROJECT_KEY=<this repo's key>
  #   Secret:    SONAR_TOKEN=<a SonarCloud analysis token>
  sonarqube:
    if: ${{ startsWith(vars.SONAR_ENABLED, 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history, so Sonar can tell new code from old
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build          # build first, so Sonar analyses the TypeScript the app ships
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.sources=src
            -Dsonar.exclusions=dist/**,node_modules/**,public/**,**/*.config.*

