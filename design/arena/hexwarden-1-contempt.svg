<svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg"><title>The Hexwarden, phase 1 of 3: contempt</title><desc>The Hexwarden in phase 1, contempt, for levels 1 to 3. The horned warden built of disassembly stands dormant in a dark hexagonal arena: every eye shut except one heavy-lidded eye, his rage core dim and all four anti-cheat plates intact. One faint glance falls on the player's Level 1 key string, and he says a single word: pathetic. Rage 1 of 9.</desc><rect x="0" y="0" width="680" height="676" fill="#0c0617"/>
