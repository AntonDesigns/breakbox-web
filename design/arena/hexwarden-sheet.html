<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Hexwarden</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"><style>body{margin:0;background:#0b0614;color:#e8dcff;font-family:'Hanken Grotesk',system-ui,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 48px}h1{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:22px;margin:0 0 8px}.lede{color:#9b84cf;margin:0 0 22px;max-width:72ch;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}@media (max-width:820px){.grid{grid-template-columns:1fr}}figure{margin:0;border:1px solid #2a1a46;border-radius:8px;background:#0c0617;overflow:hidden}figure svg{display:block;width:100%;height:auto}figcaption{padding:12px 14px 14px;border-top:1px solid #2a1a46;font-size:14px;line-height:1.55;color:#cdbaf0}figcaption b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;color:#f2e8ff}.k{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#9b84cf;margin-left:10px}</style></head><body><div class="wrap"><h1>The Hexwarden</h1><p class="lede">The boss of the Level-Experimental arena. One body, four states, all generated by hexwarden.py from one table; that table is the contract the arena component follows. Which state you see, and how angry he is, is decided on the server, never in your browser.</p><div class="grid"><figure><svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg"><title>The Hexwarden, phase 1 of 3: contempt</title><desc>The Hexwarden in phase 1, contempt, for levels 1 to 3. The horned warden built of disassembly stands dormant in a dark hexagonal arena: every eye shut except one heavy-lidded eye, his rage core dim and all four anti-cheat plates intact. One faint glance falls on the player's Level 1 key string, and he says a single word: pathetic. Rage 1 of 9.</desc><rect x="0" y="0" width="680" height="676" fill="#0c0617"/>

</svg><figcaption><b>1 · contempt</b><span class="k">levels 1-3 · rage 1</span><br>Dormant. Every eye shut but one, and that one barely open. He glances at your Level 1 key string and gives you one word.</figcaption></figure><figure><svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg"><title>The Hexwarden, phase 2 of 3: enraged</title><desc>The Hexwarden in phase 2, enraged, for levels 4 to 6. Nineteen glowing slit-pupil eyes are open on his visor, shoulders, chest and palms, his hexagonal rage core is lit, and the beaten server-key plate is shattered and reforming harder. Two beams lock onto the exact IL line the player is on and note that they hesitated. He says: you read a string, I read you. Rage 5 of 9.</desc><rect x="0" y="0" width="680" height="676" fill="#0c0617"/>

</svg><figcaption><b>3 · wrath</b><span class="k">levels 7-9 · rage 7-9</span><br>Nothing held back. New eyes open on his horns and arms, two plates shatter and re-form, and four solid beams hunt every keystroke.</figcaption></figure><figure><svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg"><title>The Hexwarden, final form: the server</title><desc>The Hexwarden's final form, the server. He has withdrawn into a server monolith: his horns rise over its top, his claws grip its sides and his eyes watch from behind bars in a slit. Where his rage core was, a lock seal reads server-signed, ECDSA P-256. The player's client-side moves, patch, breakpoint, forge and keygen, all strike the wall and fail. He says: nothing on your machine reaches me. The meter is full and the wall holds.</desc><rect x="0" y="0" width="680" height="676" fill="#0c0617"/>
