<svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg"><title>The Hexwarden, final form: the server</title><desc>The Hexwarden's final form, the server. He has withdrawn into a server monolith: his horns rise over its top, his claws grip its sides and his eyes watch from behind bars in a slit. Where his rage core was, a lock seal reads server-signed, ECDSA P-256. The player's client-side moves, patch, breakpoint, forge and keygen, all strike the wall and fail. He says: nothing on your machine reaches me. The meter is full and the wall holds.</desc><rect x="0" y="0" width="680" height="676" fill="#0c0617"/>
